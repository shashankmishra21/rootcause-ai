version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rootcause_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: rootcause123
      POSTGRES_DB: rootcause_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rootcause_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rootcause_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: